limit_req_zone $binary_remote_addr zone=attest_api:1m rate=5r/s;
server {
    listen 80;
    server_name attest.axiqo.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name attest.axiqo.xyz;
    ssl_certificate /etc/letsencrypt/live/attest.axiqo.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attest.axiqo.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        limit_req zone=attest_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4070;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:4070;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
