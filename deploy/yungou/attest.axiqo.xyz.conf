limit_req_zone $binary_remote_addr zone=attest_api:1m rate=5r/s;
# Access log without the query string (R5-07, 19 Oct 2026): team download links carry a short-lived ticket in the query
# string, and the ticket must not sit in the access log for its lifetime; same file as before, this format for this host only.
log_format attest_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
server {
    listen 80;
    server_name attest.axiqo.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name attest.axiqo.xyz;
    ssl_certificate /etc/letsencrypt/live/attest.axiqo.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attest.axiqo.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    access_log /var/log/nginx/access.log attest_noquery;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # the page and its static files change with every deployment and carry ETags: browsers must revalidate rather than
    # reuse a heuristically fresh copy (18 Oct 2026: a cached stylesheet from the previous build broke the new page)
    add_header Cache-Control "no-cache" always;
    location /api/ {
        limit_req zone=attest_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4070;
        proxy_set_header Host $host;
        # the edge overwrites the forwarded address with the real peer (API-01): a caller cannot rotate its visitor identity
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:4070;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
