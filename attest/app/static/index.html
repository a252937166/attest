<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attest console</title>
<meta name="description" content="Attest verifies a coding agent's patch with sealed tests, a fresh sandbox and a Proof Bundle. Browse recorded evidence or run a task live.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%274%27 fill=%27%231A1E23%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-weight=%27600%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23F4F5F3%27%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to the run</a>
<div class="wrap">
<header class="bar">
  <div class="brand"><a class="word" href="/" data-home>Attest</a><span class="tag">Evidence-gated coding agent</span></div>
  <div class="status" id="status" aria-live="polite">
    <span class="chip" id="chip-service"><span class="dot" id="chip-service-dot"></span><span id="chip-service-text">Connecting to the service</span></span>
    <span class="chip" id="chip-budget">Today's Nemotron budget <span class="muted" id="chip-budget-text">loading</span></span>
    <span class="chip" id="chip-runs">Runs <span class="muted" id="chip-runs-text">loading</span></span>
  </div>
</header>

<div class="app">
  <aside class="rail" aria-label="Workspace and history">
  <details id="rail-details" open><summary class="rail-summary">Workspace and history</summary>
    <section>
      <h2>Workspace</h2>
      <label class="field">Task
        <select id="task" data-focus="task"></select>
      </label>
      <div class="modes" role="radiogroup" aria-label="Mode">
        <label class="mode"><input type="radio" name="mode" value="browse" data-focus="mode-browse" checked><span><span class="l">Browse recorded evidence</span><br><span class="d">No inference. Opens the latest recorded run of this task.</span></span></label>
        <label class="mode"><input type="radio" name="mode" value="live" data-focus="mode-live"><span><span class="l" id="mode-live-label">Run live on Nemotron</span><br><span class="d">Starts a new run in Nebius Token Factory Sandboxes.</span></span></label>
      </div>
      <div class="estimate" id="estimate"></div>
      <label class="field" id="profile-field" hidden>Inference profile
        <select id="profile" data-focus="profile"></select>
      </label>
      <button type="button" class="btn block" id="go" data-focus="go">Open the latest recorded run</button>
      <p class="note" id="start-note"></p>
      <p class="note" id="public-note">Public runs use the Nemotron profile.</p>
      <details id="signin"><summary>Team sign-in</summary>
        <label class="field">Team token<input id="admin" type="password" autocomplete="off" data-focus="admin" placeholder="Shown nothing extra until it is valid"></label>
        <button type="button" class="btn secondary" id="signin-go" data-focus="signin-go">Sign in</button>
        <p class="note" id="signin-note"></p>
      </details>
      <p class="note planned">Planned, not in this build: bring your own Python repository at a pinned commit.</p>
    </section>
    <section>
      <h2>History</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter history"></div>
      <ul class="history" id="history"></ul>
    </section>
  </details>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
